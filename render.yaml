# Blueprint de Render (plan Free, sin tarjeta).
# Con este archivo el servicio se crea solo al conectar el repositorio.
services:
  - type: web
    name: diagnostico-mecanica
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # El refresco de precios corre mientras el servicio está despierto.
      - key: PRICE_SYNC
        value: "1"
      # Se piden al crear el servicio; se pueden dejar vacíos y rellenar después.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: AFFILIATE_TAG_AMAZON
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
