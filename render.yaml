# Blueprint de Render (plan Free, sin tarjeta).
# Con este archivo el servicio se crea solo al conectar el repositorio.
# Las claves sensibles (IA, Stripe, afiliación) se añaden después en el panel:
# Environment → Add Environment Variable, sin volver a desplegar el blueprint.
services:
  - type: web
    name: diagnostico-mecanica
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # El refresco de precios corre mientras el servicio está despierto.
      - key: PRICE_SYNC
        value: "1"
      # --- Monetización (sin secretos; las claves van en el panel de Render) ---
      - key: PUBLIC_BASE_URL
        value: https://diagnostico-mecanica.onrender.com
      - key: AFFILIATE_TAG_AMAZON
        value: selupirootools-21
      - key: REPORT_PRICE_CENTS
        value: "990"
      - key: REPORT_CURRENCY
        value: eur
      - key: REPORT_PRODUCT_NAME
        value: Informe técnico PRO
      # Copia de seguridad de la base de datos y de los archivos subidos.
      # En el plan Free el disco se borra en cada despliegue: esto es lo que
      # conserva las cuentas, los coches y las facturas entre versiones.
      - key: DB_BACKUP_BUCKET
        value: mecanica-db
      # Secretas — añadir SOLO en el panel de Render (Environment), nunca aquí:
      # SUPABASE_URL=https://xxxx.supabase.co
      # SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOi...
      # STRIPE_SECRET_KEY=sk_live_...        (clave Live, no de test, para cobrar de verdad)
      # STRIPE_WEBHOOK_SECRET=whsec_...      (webhook Live de /api/payments/webhook)
      # AWIN_PUBLISHER_ID=                    (cuando te des de alta en Awin)
