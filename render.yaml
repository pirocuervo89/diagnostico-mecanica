# Blueprint de Render (plan Free, sin tarjeta).
# Con este archivo el servicio se crea solo al conectar el repositorio.
# Las claves sensibles (IA, Stripe, afiliación) se añaden después en el panel:
# Environment → Add Environment Variable, sin volver a desplegar el blueprint.
services:
  - type: web
    name: diagnostico-mecanica
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # El refresco de precios corre mientras el servicio está despierto.
      - key: PRICE_SYNC
        value: "1"
